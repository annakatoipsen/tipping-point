<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formue Beregner</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Formue Beregner</h1>
            <p>Simple renters-rente beregninger</p>
        </header>

        <main>
            <div class="calculator-section">
                <div class="input-grid">
                    <div class="input-group">
                        <label for="principal">Startbeløb</label>
                        <div class="input-wrapper">
                            <span class="currency">kr</span>
                            <input type="number" id="principal" value="75000" min="0" step="1000">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="monthly">Månedlig Indbetaling</label>
                        <div class="input-wrapper">
                            <span class="currency">kr</span>
                            <input type="number" id="monthly" value="3000" min="0" step="500">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="rate">Årligt Afkast</label>
                        <div class="input-wrapper">
                            <input type="number" id="rate" value="7" min="0" max="100" step="0.1">
                            <span class="percent">%</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="years">År</label>
                        <div class="input-wrapper">
                            <input type="number" id="years" value="30" min="1" max="100" step="1">
                        </div>
                    </div>
                </div>

                <div class="tabs">
                    <button class="tab active" data-tab="basic">Grundlæggende</button>
                    <button class="tab" data-tab="goal">Målplanlægning</button>
                    <button class="tab" data-tab="required">Nødvendig Opsparing</button>
                </div>

                <div class="tab-content active" id="basic-content">
                    <div class="results-section">
                        <div class="result-card primary">
                            <h3>Slutsaldo</h3>
                            <div class="amount" id="final-balance">0 kr</div>
                        </div>
                        
                        <div class="result-grid">
                            <div class="result-card">
                                <h4>Samlede Indbetalinger</h4>
                                <div class="amount small" id="total-contributions">0 kr</div>
                            </div>
                            <div class="result-card">
                                <h4>Samlede Renter</h4>
                                <div class="amount small" id="total-interest">0 kr</div>
                            </div>
                            <div class="result-card">
                                <h4>Effektiv Rente</h4>
                                <div class="amount small" id="effective-rate">0%</div>
                            </div>
                        </div>
                    </div>

                    <div class="chart-section">
                        <canvas id="growth-chart" width="800" height="400"></canvas>
                    </div>

                    <div class="breakdown-section">
                        <h3>År-for-År Opdeling</h3>
                        <div class="breakdown-table-wrapper">
                            <table class="breakdown-table" id="breakdown-table">
                                <thead>
                                    <tr>
                                        <th>År</th>
                                        <th>Saldo</th>
                                        <th>Renter</th>
                                        <th>Indbetalinger</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="goal-content">
                    <div class="goal-inputs">
                        <div class="input-group">
                            <label for="target">Målbeløb</label>
                            <div class="input-wrapper">
                                <span class="currency">kr</span>
                                <input type="number" id="target" value="7500000" min="1" step="10000">
                            </div>
                        </div>
                    </div>
                    <div class="goal-results">
                        <div class="result-card primary">
                            <h3>Tid til Mål</h3>
                            <div class="amount" id="time-to-goal">0 år</div>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="required-content">
                    <div class="required-inputs">
                        <div class="input-group">
                            <label for="req-target">Målbeløb</label>
                            <div class="input-wrapper">
                                <span class="currency">kr</span>
                                <input type="number" id="req-target" value="7500000" min="1" step="10000">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="req-years">Tidsramme</label>
                            <div class="input-wrapper">
                                <input type="number" id="req-years" value="30" min="1" max="100" step="1">
                            </div>
                        </div>
                    </div>
                    <div class="required-results">
                        <div class="result-card primary">
                            <h3>Nødvendig Månedlig Opsparing</h3>
                            <div class="amount" id="required-monthly">0 kr</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="web-calculator.js" type="module"></script>
</body>
</html>
